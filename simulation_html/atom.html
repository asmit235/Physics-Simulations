<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Atom Model</title>
  <style>
    body {
      background: #050505;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 15px;
      box-sizing: border-box;
      color: white;
    }
    .app-container {
      width: 100%;
      max-width: 680px; /* Keeps the size manageable on big screens */
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #00000A;
      display: block;
      box-shadow: 0 4px 30px rgba(0, 255, 255, 0.1);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
    }
    label {
      font-size: 14px;
      color: #aaa;
    }
    input[type="range"] {
      accent-color: #00ffff;
    }
  </style>
</head>
<body>

<div class="app-container">
  <canvas id="atomCanvas" width="680" height="480"></canvas>
  
  <div class="controls">
    <label for="speedControl">Electron Speed</label>
    <input type="range" id="speedControl" min="0.5" max="3" step="0.1" value="1">
  </div>
</div>

<script>
  const cv = document.getElementById('atomCanvas');
  const cx = cv.getContext('2d');
  const W = 680, H = 480, CX = W / 2, CY = H / 2;
  
  let speedMultiplier = 1;

  // Define the 3 intersecting orbits
  const orbitRadiusX = 220; // How wide the orbit is
  const orbitRadiusY = 70;  // How tall the orbit is
  
  const orbits = [
    { angle: 0,                 speed: 0.020, color: '#00ffff', eAngle: 0 },         // Cyan
    { angle: Math.PI / 3,       speed: 0.025, color: '#ff00ff', eAngle: Math.PI },   // Magenta
    { angle: (Math.PI * 2) / 3, speed: 0.015, color: '#ffff00', eAngle: Math.PI/2 }  // Yellow
  ];

  // Define the protons (red) and neutrons (blue) in the nucleus
  const nucleusParticles = [
    {x: -6, y: -6, color: '#ff3333'}, {x: 6, y: -6, color: '#3333ff'},
    {x: 0, y: 7, color: '#ff3333'},   {x: -9, y: 4, color: '#3333ff'},
    {x: 9, y: 3, color: '#ff3333'},   {x: 0, y: -9, color: '#3333ff'}
  ];

  function drawNucleus() {
    // Add a tiny random "jiggle" to simulate quantum vibration/energy
    const jiggleX = (Math.random() - 0.5) * 1.5;
    const jiggleY = (Math.random() - 0.5) * 1.5;

    nucleusParticles.forEach(p => {
      const px = CX + p.x + jiggleX;
      const py = CY + p.y + jiggleY;

      // Draw particle base
      cx.beginPath();
      cx.arc(px, py, 9, 0, Math.PI * 2);
      cx.fillStyle = p.color;
      cx.fill();

      // Draw a little white highlight to make them look like 3D spheres
      cx.beginPath();
      cx.arc(px - 3, py - 3, 3, 0, Math.PI * 2);
      cx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      cx.fill();
    });
  }

  function frame() {
    // Clear the canvas with a slight trail effect
    cx.fillStyle = 'rgba(5, 5, 5, 0.3)';
    cx.fillRect(0, 0, W, H);

    // Draw the orbits and electrons
    orbits.forEach((orbit) => {
      cx.save();
      
      // Move the canvas center to the middle and rotate for the specific orbit
      cx.translate(CX, CY);
      cx.rotate(orbit.angle);

      // 1. Draw the faint orbit path
      cx.beginPath();
      cx.ellipse(0, 0, orbitRadiusX, orbitRadiusY, 0, 0, Math.PI * 2);
      cx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      cx.lineWidth = 2;
      cx.stroke();

      // 2. Calculate where the electron is on the ellipse right now
      orbit.eAngle += (orbit.speed * speedMultiplier);
      const ex = Math.cos(orbit.eAngle) * orbitRadiusX;
      const ey = Math.sin(orbit.eAngle) * orbitRadiusY;

      // 3. Draw the electron
      cx.beginPath();
      cx.arc(ex, ey, 5, 0, Math.PI * 2);
      cx.fillStyle = orbit.color;
      cx.fill();
      
      // 4. Draw a glowing halo around the electron
      cx.beginPath();
      cx.arc(ex, ey, 14, 0, Math.PI * 2);
      cx.fillStyle = orbit.color;
      cx.globalAlpha = 0.2;
      cx.fill();

      cx.restore(); // Reset the canvas rotation for the next orbit
    });

    // Draw the nucleus last so it sits on top of the orbits
    drawNucleus();

    // Loop the animation
    requestAnimationFrame(frame);
  }

  // Hook up the speed slider
  document.getElementById('speedControl').addEventListener('input', function(e) {
    speedMultiplier = parseFloat(e.target.value);
  });

  // Start the animation
  frame();
</script>
</body>
</html>
