<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fission Chain Reaction</title>
  <style>
    body {
      background: #050505;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      padding: 15px;
      box-sizing: border-box;
      color: #aaa;
    }
    .app-container {
      width: 100%;
      max-width: 680px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #00000A;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      cursor: crosshair;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 12px;
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    button {
      font-family: monospace;
      font-size: 14px;
      padding: 8px 16px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #FF7043;
      color: #000;
    }
  </style>
</head>
<body>

<div class="app-container">
  <p style="text-align: center; margin-bottom: 10px;">Click anywhere on the canvas to inject a starting neutron.</p>
  
  <canvas id="c" width="680" height="480"></canvas>
  
  <div class="controls">
    <div class="stats">
      <span id="nucleiCount">Nuclei: 0</span>
      <span id="neutronCount">Neutrons: 0</span>
    </div>
    <button onclick="resetSimulation()">Reset Core</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = 680, H = 480;

// Physics & Memory Constants
const NUCLEI_COUNT = 300; // Kept reasonable for 4GB RAM limits
const NUCLEUS_RADIUS = 6;
const NEUTRON_RADIUS = 2;
const NEUTRON_SPEED = 4;
const NEUTRONS_PER_FISSION = 3;

let nuclei = [];
let neutrons = [];
let activeFissions = []; // Used to draw quick explosion flashes

// UI Elements
const uiNuclei = document.getElementById('nucleiCount');
const uiNeutrons = document.getElementById('neutronCount');

// Initialize the uranium core
function resetSimulation() {
  nuclei = [];
  neutrons = [];
  activeFissions = [];
  
  // Distribute nuclei randomly, keeping them away from the absolute edges
  for(let i = 0; i < NUCLEI_COUNT; i++) {
    nuclei.push({
      x: 40 + Math.random() * (W - 80),
      y: 40 + Math.random() * (H - 80),
      active: true
    });
  }
  updateStats();
}

// Fire a neutron manually via click
cv.addEventListener('mousedown', (e) => {
  const rect = cv.getBoundingClientRect();
  const scaleX = cv.width / rect.width;
  const scaleY = cv.height / rect.height;
  
  const clickX = (e.clientX - rect.left) * scaleX;
  const clickY = (e.clientY - rect.top) * scaleY;
  
  // Inject a single fast neutron moving in a random direction
  const angle = Math.random() * Math.PI * 2;
  neutrons.push({
    x: clickX,
    y: clickY,
    vx: Math.cos(angle) * NEUTRON_SPEED,
    vy: Math.sin(angle) * NEUTRON_SPEED
  });
});

function updateStats() {
  uiNuclei.textContent = `U-235 Nuclei: ${nuclei.length}`;
  uiNeutrons.textContent = `Active Neutrons: ${neutrons.length}`;
}

// Distance helper function
function getDistance(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function updatePhysics() {
  // Move neutrons backwards to allow safe removal from array without skipping elements
  for (let i = neutrons.length - 1; i >= 0; i--) {
    let n = neutrons[i];
    n.x += n.vx;
    n.y += n.vy;

    // MEMORY OPTIMIZATION: Remove neutrons that leave the canvas bounds
    if (n.x < 0 || n.x > W || n.y < 0 || n.y > H) {
      neutrons.splice(i, 1);
      continue; 
    }

    // Check collision with intact nuclei
    let collided = false;
    for (let j = nuclei.length - 1; j >= 0; j--) {
      let core = nuclei[j];
      if (getDistance(n.x, n.y, core.x, core.y) < NUCLEUS_RADIUS + NEUTRON_RADIUS) {
        // Trigger Fission!
        activeFissions.push({ x: core.x, y: core.y, life: 1.0 });
        
        // Remove the struck nucleus
        nuclei.splice(j, 1);
        
        // Remove the incoming neutron
        neutrons.splice(i, 1);
        collided = true;
        
        // Spawn 3 new neutrons in random directions
        for(let k = 0; k < NEUTRONS_PER_FISSION; k++) {
          const angle = Math.random() * Math.PI * 2;
          neutrons.push({
            x: core.x,
            y: core.y,
            vx: Math.cos(angle) * NEUTRON_SPEED,
            vy: Math.sin(angle) * NEUTRON_SPEED
          });
        }
        break; // Neutron is destroyed, stop checking other nuclei
      }
    }
  }
}

function draw() {
  cx.clearRect(0, 0, W, H);

  // Draw Nuclei (Uranium-235)
  for (let core of nuclei) {
    cx.beginPath();
    cx.arc(core.x, core.y, NUCLEUS_RADIUS, 0, Math.PI * 2);
    cx.fillStyle = '#4CAF50'; // Stable green
    cx.fill();
    cx.strokeStyle = '#2E7D32';
    cx.lineWidth = 2;
    cx.stroke();
  }

  // Draw Fission Flashes
  for (let i = activeFissions.length - 1; i >= 0; i--) {
    let f = activeFissions[i];
    cx.beginPath();
    cx.arc(f.x, f.y, NUCLEUS_RADIUS * 3 * (1 - f.life), 0, Math.PI * 2);
    cx.fillStyle = `rgba(255, 112, 67, ${f.life})`;
    cx.fill();
    
    f.life -= 0.1; // Fade out quickly
    if (f.life <= 0) activeFissions.splice(i, 1);
  }

  // Draw moving neutrons
  for (let n of neutrons) {
    cx.beginPath();
    cx.arc(n.x, n.y, NEUTRON_RADIUS, 0, Math.PI * 2);
    cx.fillStyle = '#FFF'; // High energy white
    cx.fill();
    
    // Tiny trail for visual effect
    cx.beginPath();
    cx.moveTo(n.x, n.y);
    cx.lineTo(n.x - n.vx * 2, n.y - n.vy * 2);
    cx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    cx.lineWidth = 1.5;
    cx.stroke();
  }
}

function frame() {
  updatePhysics();
  draw();
  
  // Only update DOM stats occasionally to save UI rendering overhead
  if(Math.random() < 0.1) updateStats();

  requestAnimationFrame(frame);
}

// Start the simulation
resetSimulation();
frame();
</script>
</body>
</html>
