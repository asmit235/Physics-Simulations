<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3-Body Orbit Simulation</title>
  <style>
    body {
      background: #050505;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 15px;
      box-sizing: border-box;
      color: white;
    }
    .app-container {
      width: 100%;
      max-width: 800px;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #00000A;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 12px;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }
    .control-item label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .control-item input {
      width: 100%;
      accent-color: #aaa;
    }
    .val-display {
      font-size: 12px;
      margin-top: 5px;
      color: #fff;
    }
    /* Accent colors for sliders matching the bodies */
    #m0 { accent-color: #FFD700; }
    #m1 { accent-color: #FF7043; }
    #m2 { accent-color: #4FC3F7; }
  </style>
</head>
<body>

<div class="app-container">
  <canvas id="simCanvas" width="800" height="550"></canvas>
  
  <div class="controls">
    <div class="control-item">
      <label style="color: #FFD700;">Star Mass</label>
      <input type="range" id="m0" min="100" max="2000" step="50" value="1000" oninput="updateMass(0, this.value)">
      <div class="val-display" id="m0v">1000</div>
    </div>
    
    <div class="control-item">
      <label style="color: #FF7043;">Planet Mass</label>
      <input type="range" id="m1" min="1" max="300" step="5" value="50" oninput="updateMass(1, this.value)">
      <div class="val-display" id="m1v">50</div>
    </div>

    <div class="control-item">
      <label style="color: #4FC3F7;">Moon Mass</label>
      <input type="range" id="m2" min="0.1" max="50" step="0.5" value="5" oninput="updateMass(2, this.value)">
      <div class="val-display" id="m2v">5</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  // Physics Constants optimized for performance
  const G = 2.5; 
  const dt = 0.04; 
  const softening = 4.0; 
  const maxTrail = 250; 

  // Initial State: Hierarchical System (Star, Planet, Moon)
  let bodies = [
    // 0: Star (Massive, center, slight downward drift to counter planet momentum)
    { m: 1000, x: 400, y: 275, vx: 0, vy: -0.15, color: '#FFD700', trail: [] },
    // 1: Planet (Medium mass, orbiting star at distance 200)
    { m: 50, x: 200, y: 275, vx: 0, vy: 3.53, color: '#FF7043', trail: [] },
    // 2: Moon (Low mass, orbiting planet at distance 30)
    { m: 5, x: 170, y: 275, vx: 0, vy: 5.57, color: '#4FC3F7', trail: [] }
  ];

  // UI Interaction: Updates mass and clears trails to free up memory
  function updateMass(index, value) {
    bodies[index].m = parseFloat(value);
    document.getElementById('m' + index + 'v').innerText = value;
    
    // Memory Optimization: Clear trails when gravity radically changes
    bodies.forEach(b => b.trail = []);
  }

  function updatePhysics() {
    for (let i = 0; i < bodies.length; i++) {
      let ax = 0, ay = 0;

      for (let j = 0; j < bodies.length; j++) {
        if (i === j) continue;

        let dx = bodies[j].x - bodies[i].x;
        let dy = bodies[j].y - bodies[i].y;
        
        let distSq = dx*dx + dy*dy + softening*softening;
        let dist = Math.sqrt(distSq);

        let force = (G * bodies[j].m) / distSq;
        ax += force * (dx / dist);
        ay += force * (dy / dist);
      }

      bodies[i].vx += ax * dt;
      bodies[i].vy += ay * dt;
    }

    for (let i = 0; i < bodies.length; i++) {
      bodies[i].x += bodies[i].vx * dt;
      bodies[i].y += bodies[i].vy * dt;

      // Trail array management (FIFO queue)
      bodies[i].trail.push({ x: bodies[i].x, y: bodies[i].y });
      if (bodies[i].trail.length > maxTrail) {
        bodies[i].trail.shift(); 
      }
    }
  }

  function draw() {
    // Clear the canvas fully each frame to avoid artifacting on long runs
    ctx.fillStyle = '#00000A';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < bodies.length; i++) {
      let b = bodies[i];

      // Render Trails
      if (b.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x, b.trail[0].y);
        for (let j = 1; j < b.trail.length; j++) {
          ctx.lineTo(b.trail[j].x, b.trail[j].y);
        }
        ctx.strokeStyle = b.color;
        ctx.lineWidth = 1.2;
        ctx.globalAlpha = 0.6;
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      }

      // Render Body (Radius dynamically scales with mass using a cube root for better visual balance)
      ctx.beginPath();
      let visualRadius = Math.max(2, Math.pow(b.m, 1/3) * 1.5);
      ctx.arc(b.x, b.y, visualRadius, 0, Math.PI * 2);
      
      // Core
      ctx.fillStyle = b.color;
      ctx.fill();
      
      // Outer glow for stars/heavy planets
      if (b.m > 20) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, visualRadius * 2, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.globalAlpha = 0.15;
          ctx.fill();
          ctx.globalAlpha = 1.0;
      }
    }
  }

  function loop() {
    // Run multiple physics steps per visual frame for better mathematical stability
    // This allows us to keep 'dt' small without the simulation moving in slow-motion
    for(let step = 0; step < 3; step++) {
        updatePhysics();
    }
    
    draw();
    requestAnimationFrame(loop);
  }

  // Kick off the simulation
  loop();
</script>
</body>
</html>
