<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Theory: Calabi-Yau with XYZ Axes</title>
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: monospace;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 700px;
      width: 100%;
    }
    canvas {
      width: 100%;
      height: 450px;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,255,100,0.1);
    }
    .controls {
      background: #111;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      border: 1px solid #333;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 12px; color: #aaa; }
    input[type=range] { accent-color: #00ff66; }
    .info {
      grid-column: span 2;
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <canvas id="canvas" width="700" height="450"></canvas>
  
  <div class="controls">
    <div class="control-group">
      <label>Dimensional Complexity (n): <span id="n_val">3</span></label>
      <input type="range" id="param_n" min="1" max="8" step="0.5" value="3">
    </div>
    <div class="control-group">
      <label>Scale (Zoom): <span id="scale_val">150</span></label>
      <input type="range" id="scale" min="50" max="300" step="10" value="150">
    </div>
    <div class="control-group">
      <label>Rotate X Axis (Pitch): <span id="rot_x_val">0</span>°</label>
      <input type="range" id="rot_x" min="0" max="360" value="45">
    </div>
    <div class="control-group">
      <label>Rotate Y Axis (Yaw): <span id="rot_y_val">0</span>°</label>
      <input type="range" id="rot_y" min="0" max="360" value="45">
    </div>
    <div class="control-group">
      <label>Rotate Z Axis (Roll): <span id="rot_z_val">0</span>°</label>
      <input type="range" id="rot_z" min="0" max="360" value="0">
    </div>
    <div class="control-group">
      <label>Auto-Rotate</label>
      <input type="checkbox" id="auto_rot" checked>
    </div>
    <div class="info">
      Rendering a 3D projection of a parameterized manifold with X (Red), Y (Green), and Z (Blue) spatial axes.
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const cx = width / 2;
  const cy = height / 2;

  // DOM Elements
  const inputs = {
    n: document.getElementById('param_n'),
    scale: document.getElementById('scale'),
    rx: document.getElementById('rot_x'),
    ry: document.getElementById('rot_y'),
    rz: document.getElementById('rot_z'),
    auto: document.getElementById('auto_rot')
  };

  const displays = {
    n: document.getElementById('n_val'),
    scale: document.getElementById('scale_val'),
    rx: document.getElementById('rot_x_val'),
    ry: document.getElementById('rot_y_val'),
    rz: document.getElementById('rot_z_val')
  };

  let angleX = 45 * Math.PI / 180;
  let angleY = 45 * Math.PI / 180;
  let angleZ = 0;
  
  function updateDisplays() {
    displays.n.innerText = inputs.n.value;
    displays.scale.innerText = inputs.scale.value;
    displays.rx.innerText = parseFloat(inputs.rx.value).toFixed(0);
    displays.ry.innerText = parseFloat(inputs.ry.value).toFixed(0);
    displays.rz.innerText = parseFloat(inputs.rz.value).toFixed(0);
  }

  function generatePoints(n) {
    const points = [];
    const resolution = 30; 
    for (let u = 0; u < Math.PI * 2; u += Math.PI / resolution) {
      const row = [];
      for (let v = 0; v < Math.PI * 2; v += Math.PI / resolution) {
        const x = Math.sin(u) * Math.cos(v) * Math.sin(n * v);
        const y = Math.cos(u) * Math.sin(v) * Math.cos(n * u);
        const z = Math.sin(u) * Math.sin(v) * Math.cos(n * v);
        row.push({x, y, z});
      }
      points.push(row);
    }
    return points;
  }

  function rotate3D(p, ax, ay, az) {
    // Rotate X
    let y1 = p.y * Math.cos(ax) - p.z * Math.sin(ax);
    let z1 = p.y * Math.sin(ax) + p.z * Math.cos(ax);
    // Rotate Y
    let x2 = p.x * Math.cos(ay) + z1 * Math.sin(ay);
    let z2 = -p.x * Math.sin(ay) + z1 * Math.cos(ay);
    // Rotate Z
    let x3 = x2 * Math.cos(az) - y1 * Math.sin(az);
    let y3 = x2 * Math.sin(az) + y1 * Math.cos(az);
    return { x: x3, y: y3, z: z2 };
  }

  function project(p, scale) {
    const distance = 4;
    const z = distance + p.z;
    const px = cx + (p.x / z) * scale * 2;
    const py = cy + (p.y / z) * scale * 2;
    return { x: px, y: py, z: p.z };
  }

  function drawAxes(scale) {
    const axisLen = 1.5; // Length of the axes
    const axes = [
      { p1: {x: -axisLen, y: 0, z: 0}, p2: {x: axisLen, y: 0, z: 0}, color: '#ff4444', label: 'X' }, // Red
      { p1: {x: 0, y: -axisLen, z: 0}, p2: {x: 0, y: axisLen, z: 0}, color: '#44ff44', label: 'Y' }, // Green
      { p1: {x: 0, y: 0, z: -axisLen}, p2: {x: 0, y: 0, z: axisLen}, color: '#4444ff', label: 'Z' }  // Blue
    ];

    ctx.lineWidth = 2;
    ctx.font = '14px monospace';

    axes.forEach(axis => {
      // Rotate
      const rot1 = rotate3D(axis.p1, angleX, angleY, angleZ);
      const rot2 = rotate3D(axis.p2, angleX, angleY, angleZ);
      
      // Project
      const proj1 = project(rot1, scale);
      const proj2 = project(rot2, scale);

      // Draw Line
      ctx.strokeStyle = axis.color;
      ctx.beginPath();
      ctx.moveTo(proj1.x, proj1.y);
      ctx.lineTo(proj2.x, proj2.y);
      ctx.stroke();

      // Draw Label at positive end
      ctx.fillStyle = axis.color;
      ctx.fillText(axis.label, proj2.x + 5, proj2.y + 5);
    });
  }

  function render() {
    ctx.clearRect(0, 0, width, height);
    
    const n = parseFloat(inputs.n.value);
    const scale = parseFloat(inputs.scale.value);
    
    if (inputs.auto.checked) {
      inputs.rx.value = (parseFloat(inputs.rx.value) + 0.5) % 360;
      inputs.ry.value = (parseFloat(inputs.ry.value) + 0.3) % 360;
    }

    angleX = inputs.rx.value * Math.PI / 180;
    angleY = inputs.ry.value * Math.PI / 180;
    angleZ = inputs.rz.value * Math.PI / 180;

    updateDisplays();

    // Draw XYZ Coordinate System First (so it sits behind/inside the manifold)
    drawAxes(scale);

    const points = generatePoints(n);
    const projected = [];

    // Project Manifold points
    for (let i = 0; i < points.length; i++) {
      const row = [];
      for (let j = 0; j < points[i].length; j++) {
        const rotated = rotate3D(points[i][j], angleX, angleY, angleZ);
        row.push(project(rotated, scale));
      }
      projected.push(row);
    }

    // Draw Manifold Wireframe
    ctx.lineWidth = 0.5;
    for (let i = 0; i < projected.length - 1; i++) {
      for (let j = 0; j < projected[i].length - 1; j++) {
        const p1 = projected[i][j];
        const p2 = projected[i+1][j];
        const p3 = projected[i][j+1];

        const colorVal = Math.floor(((p1.z + 1) / 2) * 255);
        ctx.strokeStyle = `rgba(0, ${colorVal}, ${255 - colorVal}, 0.6)`;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.stroke();
      }
    }

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
