<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Mass Orbit</title>
  <style>
    body {
      background: #050505;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 15px;
      box-sizing: border-box;
      color: white;
    }
    .app-container {
      width: 100%;
      max-width: 680px; /* This stops it from becoming too massive */
    }
    canvas {
      width: 100%;
      height: auto; /* Scales proportionally */
      border-radius: 12px;
      background: #00000A;
      display: block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 15px;
      border-radius: 12px;
    }
    .control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 160px;
    }
    .control-item label {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
    }
    .control-item input {
      flex: 1;
      accent-color: #FFD700;
    }
    .control-item span {
      font-size: 13px;
      font-weight: 500;
      min-width: 28px;
    }
    button {
      font-size: 13px;
      padding: 6px 14px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>

<div class="app-container">
  <canvas id="c" width="680" height="480"></canvas>
  
  <div class="controls">
    <div class="control-item">
      <label>M₁ mass</label>
      <input type="range" id="m1" min="1" max="8" step="0.5" value="3">
      <span id="m1v">3</span>
    </div>
    <div class="control-item">
      <label>M₂ mass</label>
      <input type="range" id="m2" min="1" max="8" step="0.5" value="2">
      <span id="m2v">2</span>
    </div>
    <div class="control-item">
      <label>Speed</label>
      <input type="range" id="spd" min="0.2" max="3" step="0.1" value="1">
      <span id="spdv">1.0×</span>
    </div>
    <button onclick="paused=!paused;this.textContent=paused?'Resume':'Pause'">Pause</button>
  </div>
</div>

<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const W = 680, H = 480, CX = W/2, CY = H/2;
const SCALE = 45; // Adjusted from 55 so orbits fit beautifully inside the boundaries
const G = 1.0, D = 3.5;
const TRAIL = 180;

let M1 = 3, M2 = 2, speed = 1.0;
let t = 0, paused = false;
let trail1 = [], trail2 = [];

function omega(m1, m2) { return Math.sqrt(G*(m1+m2)/(D*D*D)); }

function positions(time, m1, m2) {
  const om = omega(m1, m2) * speed;
  const r1 = D * m2 / (m1 + m2);
  const r2 = D * m1 / (m1 + m2);
  const angle = om * time;
  return {
    x1: CX + r1 * Math.cos(angle) * SCALE,
    y1: CY + r1 * Math.sin(angle) * SCALE,
    x2: CX - r2 * Math.cos(angle) * SCALE,
    y2: CY - r2 * Math.sin(angle) * SCALE,
    r1, r2, om
  };
}

function drawOrbitPath(r, color) {
  cx.beginPath();
  cx.setLineDash([6,5]);
  cx.arc(CX, CY, r * SCALE, 0, Math.PI*2);
  cx.strokeStyle = color;
  cx.lineWidth = 0.8;
  cx.globalAlpha = 0.3;
  cx.stroke();
  cx.setLineDash([]);
  cx.globalAlpha = 1;
}

function drawTrail(trail, color) {
  if(trail.length < 2) return;
  for(let i=1;i<trail.length;i++){
    const alpha = (i/trail.length)*0.35;
    cx.beginPath();
    cx.moveTo(trail[i-1].x, trail[i-1].y);
    cx.lineTo(trail[i].x, trail[i].y);
    cx.strokeStyle = color;
    cx.lineWidth = 1.2;
    cx.globalAlpha = alpha;
    cx.stroke();
  }
  cx.globalAlpha = 1;
}

function drawMass(x, y, size, color, label, sublabel, labelSide) {
  cx.beginPath();
  cx.arc(x, y, size*2.2, 0, Math.PI*2);
  cx.fillStyle = color;
  cx.globalAlpha = 0.08;
  cx.fill();

  cx.beginPath();
  cx.arc(x, y, size*1.4, 0, Math.PI*2);
  cx.fillStyle = color;
  cx.globalAlpha = 0.22;
  cx.fill();

  cx.beginPath();
  cx.arc(x, y, size, 0, Math.PI*2);
  cx.fillStyle = color;
  cx.globalAlpha = 1;
  cx.fill();

  const lx = labelSide === 'right' ? x + size + 10 : x - size - 10;
  const anchor = labelSide === 'right' ? 'left' : 'right';
  cx.textAlign = anchor;
  cx.font = '500 13px sans-serif';
  cx.fillStyle = color;
  cx.globalAlpha = 0.95;
  cx.fillText(label, lx, y - 6);
  cx.font = '400 11px sans-serif';
  cx.fillStyle = '#aaa';
  cx.globalAlpha = 0.7;
  cx.fillText(sublabel, lx, y + 10);
  cx.globalAlpha = 1;
}

function drawCoM() {
  cx.beginPath();
  cx.arc(CX, CY, 4, 0, Math.PI*2);
  cx.fillStyle = 'rgba(255,255,255,0.45)';
  cx.fill();
  cx.font = '400 11px sans-serif';
  cx.fillStyle = 'rgba(255,255,255,0.45)';
  cx.textAlign = 'center';
  cx.fillText('center of mass', CX, CY + 20);
}

function drawSepLine(x1,y1,x2,y2) {
  cx.beginPath();
  cx.setLineDash([3,4]);
  cx.moveTo(x1,y1); cx.lineTo(x2,y2);
  cx.strokeStyle='rgba(255,255,255,0.2)';
  cx.lineWidth=0.7;
  cx.stroke();
  cx.setLineDash([]);
}

function drawPhysicsInfo(pos) {
  const om = omega(M1,M2)*speed;
  const period = (2*Math.PI/om).toFixed(1);
  const v1 = (pos.r1 * om * SCALE).toFixed(1);
  const v2 = (pos.r2 * om * SCALE).toFixed(1);

  cx.font = '400 11px monospace';
  cx.textAlign = 'left';
  const lines = [
    `ω = ${(om).toFixed(3)} rad/s`,
    `T = ${period} s`,
    `v₁ = ${v1} px/s`,
    `v₂ = ${v2} px/s`,
  ];
  lines.forEach((l,i)=>{
    cx.fillStyle='rgba(255,255,255,0.35)';
    cx.fillText(l, 14, 20+i*16);
  });
}

// Draw static stars to an off-screen canvas once for performance
let starCanvas = document.createElement('canvas');
starCanvas.width=W; starCanvas.height=H;
const sc = starCanvas.getContext('2d');
sc.fillStyle='#00000A';
sc.fillRect(0,0,W,H);
(function drawStarsOnce(){
  sc.save();
  const rng=(s)=>{let x=Math.sin(s)*10000;return x-Math.floor(x);};
  for(let i=0;i<200;i++){
    const sx=rng(i*3.1)*W,sy=rng(i*7.3)*H,sz=rng(i*1.7)*1.2+0.15;
    sc.beginPath();sc.arc(sx,sy,sz*0.45,0,Math.PI*2);
    sc.fillStyle=`rgba(255,255,255,${0.2+rng(i*5)*0.45})`;
    sc.fill();
  }
  sc.restore();
})();

function frame() {
  if(!paused) t += 0.016;

  cx.clearRect(0,0,W,H);
  cx.drawImage(starCanvas,0,0);

  const pos = positions(t, M1, M2);

  drawOrbitPath(pos.r1, '#FFD700');
  drawOrbitPath(pos.r2, '#FF7043');

  trail1.push({x:pos.x1,y:pos.y1});
  trail2.push({x:pos.x2,y:pos.y2});
  if(trail1.length>TRAIL) trail1.shift();
  if(trail2.length>TRAIL) trail2.shift();

  drawTrail(trail1,'#FFD700');
  drawTrail(trail2,'#FF7043');

  drawSepLine(pos.x1,pos.y1,pos.x2,pos.y2);
  drawCoM();
  drawMass(pos.x1,pos.y1, 5+M1*1.2, '#FFD700', `M₁ = ${M1}`, 'heavier', pos.x1<CX?'left':'right');
  drawMass(pos.x2,pos.y2, 4+M2*1.0, '#FF8C60', `M₂ = ${M2}`, 'lighter',  pos.x2<CX?'left':'right');
  drawPhysicsInfo(pos);

  requestAnimationFrame(frame);
}

document.getElementById('m1').oninput = function(){
  M1=parseFloat(this.value);
  document.getElementById('m1v').textContent=M1;
  trail1=[]; trail2=[];
};
document.getElementById('m2').oninput = function(){
  M2=parseFloat(this.value);
  document.getElementById('m2v').textContent=M2;
  trail1=[]; trail2=[];
};
document.getElementById('spd').oninput = function(){
  speed=parseFloat(this.value);
  document.getElementById('spdv').textContent=speed.toFixed(1)+'×';
};

frame();
</script>
</body>
</html>
